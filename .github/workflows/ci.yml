name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test dependencies
        run: |
          npm install --global @earendil-works/pi-coding-agent@0.84.2
          pi install npm:@gotgenes/pi-permission-system@31.1.3
      - name: Public-safety scan
        run: python3 scripts/check-public.py
      - name: Installer tests
        run: python3 tests/install_test.py
      - name: Command-judge tests
        run: node tests/command_judge_test.mjs
      - name: Shell syntax
        run: bash -n install.sh update.sh make-bundle.sh serve.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Build local mirror bundle
        run: ./make-bundle.sh
